apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-query-service
  namespace: argus-system
  labels:
    app: argus-query-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: argus-query-service
  template:
    metadata:
      labels:
        app: argus-query-service
    spec:
      containers:
      - name: argus-query-service
        image: argus/query-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: CLICKHOUSE_HOST
          value: "argus-clickhouse"
---
apiVersion: v1
kind: Service
metadata:
  name: argus-query-service
  namespace: argus-system
spec:
  selector:
    app: argus-query-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
